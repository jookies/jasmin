global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend public_http
    bind *:1401
    mode http
    default_backend gateway_public

backend gateway_public
    mode http
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:1401 check inter 1s fall 2 rise 1
    server gateway-b gateway-b:1401 check inter 1s fall 2 rise 1

frontend rest_api
    bind *:8080
    mode http
    default_backend gateway_rest

backend gateway_rest
    mode http
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:8080 check port 1401 inter 1s fall 2 rise 1
    server gateway-b gateway-b:8080 check port 1401 inter 1s fall 2 rise 1

# Every private/front-door listener tracks the public readiness endpoint.
# A standby exposes only /live and /ready on :1401, so HAProxy never forwards
# admin, jCli or SMPP traffic until that same process owns the database fence.
frontend admin_web
    bind *:8404
    default_backend gateway_admin_web

backend gateway_admin_web
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:8404 check port 1401 inter 1s fall 2 rise 1
    server gateway-b gateway-b:8404 check port 1401 inter 1s fall 2 rise 1

# Internal normalized Go control seam used only by the trusted PB sidecar.
frontend pb_facade
    bind *:8998
    default_backend gateway_pb_facade

backend gateway_pb_facade
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:8998 check port 1401 inter 1s fall 2 rise 1
    server gateway-b gateway-b:8998 check port 1401 inter 1s fall 2 rise 1

frontend jcli
    bind *:8990
    default_backend gateway_jcli

backend gateway_jcli
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:8990 check port 1401 inter 1s fall 2 rise 1
    server gateway-b gateway-b:8990 check port 1401 inter 1s fall 2 rise 1

frontend smpps
    bind *:2775
    default_backend gateway_smpps

backend gateway_smpps
    option httpchk GET /ready
    http-check expect status 200
    server gateway-a gateway-a:2775 check port 1401 inter 1s fall 2 rise 1
    server gateway-b gateway-b:2775 check port 1401 inter 1s fall 2 rise 1
