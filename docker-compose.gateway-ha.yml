# Executable active-passive HA drill for roadmap item #21.
#
#   docker compose -f docker-compose.gateway-ha.yml up --build
#   curl http://127.0.0.1:1401/ready
#   docker compose -f docker-compose.gateway-ha.yml stop gateway-a
#   # gateway-b becomes ready through the same HAProxy port.
#
# Both gateway nodes use the same immutable config and PostgreSQL database.
# Exactly one owns the namespace advisory lock; the other remains live but
# unready on :1401 until promotion.

x-gateway: &gateway
  build:
    context: .
    dockerfile: docker/Dockerfile.gateway
  image: jasmin-gateway
  restart: unless-stopped
  environment:
    ADMIN_TOKEN: dev-admin-token
    ADMIN_WEB_PASSWORD: dev-admin-password
    JCLI_PASSWORD: dev-jcli-password
    JASMIN_PB_FACADE_TOKEN: dev-pb-facade-token
  volumes:
    - ./configs/gateway.example.json:/etc/jasmin/gateway.json:ro
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    smppsim:
      condition: service_started
  healthcheck:
    test: python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:1401/live', timeout=3).status==200 else 1)"
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: jasmin
      POSTGRES_DB: jasmin
    volumes:
      - pgdata-ha:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U jasmin -d jasmin
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  smppsim:
    build:
      context: .
      dockerfile: docker/Dockerfile.fakesmsc
    image: jasmin-fake-smsc
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  gateway-a:
    <<: *gateway

  gateway-b:
    <<: *gateway

  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    volumes:
      - ./configs/haproxy.gateway-ha.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${JASMIN_HA_HTTP_PORT:-1401}:1401"
      - "127.0.0.1:${JASMIN_HA_REST_PORT:-8080}:8080"
      - "127.0.0.1:${JASMIN_HA_ADMIN_PORT:-8404}:8404"
      - "127.0.0.1:${JASMIN_HA_JCLI_PORT:-8990}:8990"
      - "127.0.0.1:${JASMIN_HA_SMPPS_PORT:-2775}:2775"
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  pbfacade:
    build:
      context: .
      dockerfile: docker/Dockerfile.pbfacade
    image: jasmin-pb-facade
    restart: unless-stopped
    environment:
      JASMIN_PB_FACADE_URL: http://haproxy:8998
      JASMIN_PB_FACADE_TOKEN: dev-pb-facade-token
    ports:
      - "127.0.0.1:${JASMIN_HA_INTERCEPTOR_PB_PORT:-8987}:8987"
      - "127.0.0.1:${JASMIN_HA_ROUTER_PB_PORT:-8988}:8988"
      - "127.0.0.1:${JASMIN_HA_CLIENT_PB_PORT:-8989}:8989"
      - "127.0.0.1:${JASMIN_HA_SMPPS_PB_PORT:-14000}:14000"
    depends_on:
      haproxy:
        condition: service_started
    healthcheck:
      test: python -c "import socket; ports=(8987,8988,8989,14000); [socket.create_connection(('127.0.0.1', p), 1).close() for p in ports]"
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata-ha:
