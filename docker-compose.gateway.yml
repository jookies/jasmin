# Go gateway (http+smppc) + full infra + a fake SMSC, for prod-like testing of
# the outbound MT path (docs/plans/007). The legacy Python stack keeps its own
# docker-compose.yml — the two files share nothing.
#
#   docker compose -f docker-compose.gateway.yml up --build
#   curl "http://localhost:1401/send?username=smppuser&password=password&to=15551234567&content=hello"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: jasmin
      POSTGRES_DB: jasmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U jasmin -d jasmin
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      # Dev-only: exposes AMQP for gated integration tests run from the host
      # (AMQP_URL=amqp://guest:guest@localhost:5673/). Host 5673 avoids clashing
      # with a legacy stack's 5672. Not needed in prod.
      - "5673:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  # Fake SMSC the smsc-primary connector binds to (accepts any bind, ESME_ROKs
  # every submit_sm — same contract as the integration test's in-process fake).
  # Point at a real SMSC by editing configs/gateway.example.json instead.
  smppsim:
    build:
      context: .
      dockerfile: docker/Dockerfile.fakesmsc
    image: jasmin-fake-smsc
    restart: unless-stopped
    ports:
      # HTTP inject trigger: /inject/mo and /inject/dlr push deliver_sm
      # toward the bound gateway (MO / terminal-DLR drills).
      - "8288:8080"
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: jasmin-gateway
    restart: unless-stopped
    environment:
      # Admin API bearer token (config references it as env:ADMIN_TOKEN).
      ADMIN_TOKEN: dev-admin-token
      # Admin web UI login (config references it as env:ADMIN_WEB_PASSWORD).
      # Dev placeholder — the UI can mint users and start connectors.
      ADMIN_WEB_PASSWORD: dev-admin-password
      # jCli management console login (config references env:JCLI_PASSWORD).
      JCLI_PASSWORD: dev-jcli-password
    volumes:
      - ./configs/gateway.example.json:/etc/jasmin/gateway.json:ro
      - admindata:/var/lib/jasmin
    ports:
      - "1401:1401"
      # Admin web UI, published to host loopback ONLY. It is a privilege
      # boundary (mints credentials, starts connectors) — never publish it on
      # 0.0.0.0. The container-side 0.0.0.0 bind is namespace-scoped.
      - "127.0.0.1:8404:8404"
      # SMPPs server (inbound ESME binds), host loopback for local testing.
      - "127.0.0.1:2775:2775"
      # jCli management console, host loopback ONLY — same privilege boundary
      # as the web UI.
      - "127.0.0.1:8990:8990"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      smppsim:
        condition: service_started
    healthcheck:
      # Real readiness: Postgres ping + AMQP channel + pickle-bridge liveness +
      # required-connector bind state. /ping stays the unconditional legacy echo.
      test: python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:1401/health', timeout=8).status==200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  admindata:
