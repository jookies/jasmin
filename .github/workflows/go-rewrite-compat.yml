name: Go rewrite compatibility

on:
  push:
    branches: [go-rewrite, master]
  pull_request:
    branches: [go-rewrite, master]

permissions:
  contents: read

jobs:
  go-http-differential:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jasmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pickle bridge runtime
        run: python -m pip install --disable-pip-version-check --require-hashes -r compat/requirements-pickle-bridge.txt
      - name: Verify Go HTTP compatibility slice
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go build ./...
      - name: Gateway integration (AMQP + Postgres)
        env:
          AMQP_URL: amqp://guest:guest@localhost:5672/
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/jasmin?sslmode=disable
          PYTHON_PATH: python
        run: go test -count=1 -run TestGatewayHTTPToDurableSMPPResponse ./internal/app/gateway/

  # The admin UI bundle is committed (internal/app/adminweb/dist) so `go build`
  # needs no Node toolchain — but that means a web/src change without a rebuild
  # silently ships an older UI than the source describes. It has happened once.
  #
  # This job used to rebuild the bundle and byte-compare it against the
  # committed dist/. That check is unsound: the minifier renames identifiers
  # between environments (cW -> pW, nje -> eje), so an untouched bundle can
  # produce different bytes and fail, while a genuinely stale bundle passes
  # whenever the two environments happen to agree. It has been passing on luck.
  #
  # The bundle now carries a hash of the sources it was built from, stamped by
  # `npm run build`. Comparing that is deterministic, and it answers the real
  # question: was dist/ built from the source committed next to it? It also
  # needs no Node at all, so the job is seconds instead of minutes.
  adminweb-bundle-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fail if the committed bundle is stale
        run: |
          marker=internal/app/adminweb/bundle.sourcehash
          if [ ! -f "$marker" ]; then
            echo "::error::$marker is missing. Run 'cd web && npm run build' and commit the result."
            exit 1
          fi
          expected=$(./scripts/adminweb-source-hash.sh)
          committed=$(cat "$marker")
          if [ "$expected" != "$committed" ]; then
            echo "::error::internal/app/adminweb/dist was not built from the committed web/ sources."
            echo "  committed marker: $committed"
            echo "  current sources:  $expected"
            echo "  Run 'cd web && npm run build' and commit dist/ together with the marker."
            exit 1
          fi

  fixture-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install compatibility validation tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r compat/requirements-tools.txt
      - name: Compile compatibility tools
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f compat/compose.yaml config --quiet
          bash -n scripts/compat/run_baseline_tests.sh scripts/compat/capture_all.sh scripts/compat/run_go_macro_tests.sh
          python -m py_compile scripts/build_test_manifest.py scripts/compat/*.py
      - name: Verify inventories and fixtures
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/compat/validate_contract_registry.py --repo "${GITHUB_WORKSPACE}"
          ./scripts/compat/run_go_macro_tests.sh registry focused
          python scripts/build_test_manifest.py --check
          python scripts/compat/verify_baseline_tree.py
          python scripts/compat/verify_fixtures.py
          python scripts/compat/validate_json_schemas.py
          python -m unittest discover -s scripts/compat -p 'test_*.py'
          python scripts/compat/diff_golden.py \
            compat/fixtures/http/baseline.json \
            compat/fixtures/http/baseline.json

  fixture-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Regenerate all oracle fixtures
        run: scripts/compat/capture_all.sh
      - name: Require byte-for-byte reproducibility
        run: git diff --exit-code -- compat/fixtures

  frozen-python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run complete upstream suite against ephemeral RabbitMQ and Redis
        run: scripts/compat/run_baseline_tests.sh
