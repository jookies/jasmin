name: "CodeQL"

# This repository is a Go SMPP gateway. The analysis used to target `python`
# only, on CodeQL Action v1 which GitHub has deprecated -- so it scanned the
# frozen compatibility oracle and never the code that actually runs in
# production. It now scans Go.
#
# The frozen Python tree under jasmin/ is deliberately excluded: it is a pinned
# test asset and rollback target, byte-frozen by
# scripts/compat/verify_baseline_tree.py, so findings there are not actionable.

on:
  push:
    branches: [master, go-rewrite]
  pull_request:
    branches: [master]
  schedule:
    - cron: '25 6 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
