name: CI

# The Python reference implementation and the parity registry it served were
# removed from this repository, so the three jobs built on them are gone:
# frozen-python-regression ran the upstream Twisted suite, fixture-reproducibility
# regenerated fixtures from it, and fixture-integrity validated the 205-contract
# registry. The release gate is now SMPP 3.4 conformance plus independent interop
# (docs/plans/017-smpp-production-readiness.md).
#
# The captured fixture corpus under compat/fixtures and spec/compatibility/
# fixtures is kept as static test DATA -- replaying it is pure Go and needs no
# Python. Only regeneration needed the reference, and regeneration is gone.

on:
  push:
    branches: [go-rewrite, master]
  pull_request:
    branches: [go-rewrite, master]

permissions:
  contents: read

jobs:
  go:
    name: Build, vet and test
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jasmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Test
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Gateway integration (AMQP + Postgres)
        env:
          AMQP_URL: amqp://guest:guest@localhost:5672/
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/jasmin?sslmode=disable
        run: go test -count=1 -run TestGatewayHTTPToDurableSMPPResponse ./internal/app/gateway/

  smpp-interop:
    name: Third-party SMPP interop
    runs-on: ubuntu-latest
    # Drives the gateway with smpp.twisted -- an independent SMPP implementation
    # that shares no code with ours. Every other test exercises our server
    # against our own client helpers, which cannot catch a misreading of SMPP 3.4
    # that we hold on both ends of the wire. This is the gate that can.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the independent SMPP library
        # smpp-pdu3 is a third-party PyPI package. It is NOT the removed
        # reference implementation; the probes import only smpp.pdu and
        # smpp.twisted.
        run: python -m pip install --disable-pip-version-check smpp-pdu3 twisted

      - name: Interop against a third-party ESME
        env:
          PYTHON_PATH: python
        run: go test -count=1 -run TestThirdPartyESME -v ./internal/core/smpps/

  adminweb-bundle-freshness:
    name: Embedded UI bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fail if the committed bundle is stale
        # Compares a source hash rather than rebuilding and diffing: the minifier
        # renames identifiers between environments, so a byte comparison could
        # fail on an untouched bundle and pass on a stale one.
        run: |
          set -euo pipefail
          expected=$(./scripts/adminweb-source-hash.sh)
          committed=$(cat internal/app/adminweb/bundle.sourcehash)
          if [ "$expected" != "$committed" ]; then
            echo "internal/app/adminweb/dist is stale for the current web/ sources." >&2
            echo "  expected $expected" >&2
            echo "  committed $committed" >&2
            echo "Run 'npm run build' in web/ and commit the result." >&2
            exit 1
          fi
          echo "bundle source hash matches: $expected"
