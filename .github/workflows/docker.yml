name: Docker image

# DISABLED pending the Go cutover release decision.
#
# This workflow used to fire on every pushed tag and build ./docker/Dockerfile
# -- the *legacy Python* image -- publishing it to the upstream `jookies/jasmin`
# namespace. Once master carries the Go rewrite, the first release tag would
# therefore have shipped the implementation we are replacing, with the default
# `jcliadmin`/`jclipwd` credentials baked into its CMD.
#
# It is intentionally left as manual-dispatch-only rather than deleted, so the
# release story is a deliberate decision rather than an accident. Before
# re-enabling the tag trigger, three things must be settled:
#   1. `file:` must point at docker/Dockerfile.gateway (the Go gateway).
#   2. `images:` must name this fork's registry namespace, not jookies/jasmin.
#   3. DOCKER_USERNAME / DOCKER_PASSWORD must be this fork's credentials.
on:
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Refuse to publish until the release target is chosen
        run: |
          echo "This workflow is disabled: its build target and registry" >&2
          echo "namespace still point at the legacy Python image." >&2
          echo "See the comment at the top of .github/workflows/docker.yml." >&2
          exit 1
