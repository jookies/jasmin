<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Synevyr Messaging Platform</title>
    <link rel="icon" type="image/png" href="/brand/mark-on-dark-256w.png" />
    <!-- No web fonts, deliberately. This console is embedded in the gateway
         binary and ships to air-gapped deployments, so it must make no outbound
         request at all. It also sits on a privilege boundary bound to loopback:
         a remote font stylesheet would report every operator's IP, user-agent
         and session timing to a third party on every page load. The system font
         stack in src/App.tsx's ConfigProvider is what renders instead. -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
