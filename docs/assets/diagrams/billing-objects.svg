<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 210" role="img" aria-label="Granted, remaining and the group ceiling" preserveAspectRatio="xMidYMid meet"><rect width="640" height="210" fill="#ffffff"/><title>Granted, remaining and the group ceiling</title><desc>A group carries its own balance and message quota, shared by every member. A user carries their own balance and quota on top of that. A submit is authorised only when both the user&#x27;s own remaining balance and the group&#x27;s remaining balance can cover it, so either one being spent refuses the message.</desc><text x="40" y="20" font-size="12" font-weight="700" fill="#17201e">Group ceiling</text><text x="600" y="20" text-anchor="end" font-size="11" fill="#62706c">6% remaining</text><rect x="40" y="30" width="560" height="28" rx="6" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><rect x="40" y="30" width="33.6" height="28" rx="6" fill="#5b5bd6"></rect><path d="M60,58 L60,80 L172,80 L172,98" fill="none" stroke="#dfe6e2" stroke-width="2"></path><path d="M580,58 L580,80 L468,80 L468,98" fill="none" stroke="#dfe6e2" stroke-width="2"></path><g><text x="40" y="92" font-size="11.5" font-weight="700" fill="#17201e">User A</text><text x="300" y="92" text-anchor="end" font-size="10.5" fill="#62706c">82% remaining</text><rect x="40" y="108" width="260" height="24" rx="5" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><rect x="40" y="108" width="213.2" height="24" rx="5" fill="#12a594"></rect></g><g><text x="340" y="92" font-size="11.5" font-weight="700" fill="#17201e">User B</text><text x="600" y="92" text-anchor="end" font-size="10.5" fill="#62706c">31% remaining</text><rect x="340" y="108" width="260" height="24" rx="5" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><rect x="340" y="108" width="80.6" height="24" rx="5" fill="#12a594"></rect></g></svg>
