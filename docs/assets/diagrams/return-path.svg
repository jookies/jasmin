<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 190" role="img" aria-label="How inbound messages and delivery receipts return to your application" preserveAspectRatio="xMidYMid meet"><rect width="640" height="190" fill="#ffffff"/><title>How inbound messages and delivery receipts return to your application</title><desc>Both a mobile-originated message and a delivery receipt arrive from the SMSC as a deliver_sm PDU on the receiver side of the bind. The gateway classifies each one immediately on arrival. A mobile-originated message continues to MO route matching and is delivered to an HTTP callback or SMPP client. A delivery receipt is instead correlated to the original gateway message ID and delivered to the callback URL stored at submit time.</desc><defs><marker id="returnpath-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5bd6"></path></marker></defs><text x="150" y="16" text-anchor="middle" font-size="11" fill="#62706c">Application</text><text x="580" y="16" text-anchor="middle" font-size="11" fill="#62706c">SMSC</text><g><text x="0" y="79" font-size="13" font-weight="700" fill="#17201e">MO</text><text x="0" y="95" font-size="10" fill="#62706c">mobile-originated</text><line x1="580" x2="150" y1="74" y2="74" stroke="#5b5bd6" stroke-width="2" marker-end="url(#returnpath-arrow)"></line><g><circle cx="460" cy="74" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="460" y="60" text-anchor="middle" font-size="10.5" fill="#17201e">classified as MO</text></g><g><circle cx="280" cy="74" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="280" y="60" text-anchor="middle" font-size="10.5" fill="#17201e">MO route: priority + filters</text></g></g><g><text x="0" y="159" font-size="13" font-weight="700" fill="#17201e">DLR</text><text x="0" y="175" font-size="10" fill="#62706c">delivery receipt</text><line x1="580" x2="150" y1="154" y2="154" stroke="#5b5bd6" stroke-width="2" marker-end="url(#returnpath-arrow)"></line><g><circle cx="460" cy="154" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="460" y="140" text-anchor="middle" font-size="10.5" fill="#17201e">classified as receipt</text></g><g><circle cx="280" cy="154" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#17201e">correlated to gateway ID</text></g></g></svg>
