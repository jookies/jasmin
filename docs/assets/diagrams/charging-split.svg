<svg xmlns="http://www.w3.org/2000/svg" width="640" height="172" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 172" role="img" aria-label="How one message rate is split between submit time and acceptance" preserveAspectRatio="xMidYMid meet"><rect width="640" height="172" fill="#ffffff"/><title>How one message rate is split between submit time and acceptance</title><desc>On a prepaid account the whole rate is taken when the message is admitted. On a split account only the configured percentage is taken at submit and the remainder is applied after the SMSC accepts the message.</desc><g><text x="0" y="32" font-size="14" font-weight="600" fill="#17201e">Prepaid</text><text x="0" y="50" font-size="12" fill="#62706c">the default: no split configured</text><rect x="216" y="16" width="380" height="26" rx="4" fill="#12a594"></rect><text x="224" y="34" font-size="12" font-weight="600" fill="#ffffff">100%</text></g><g><text x="0" y="104" font-size="14" font-weight="600" fill="#17201e">Split 50%</text><text x="0" y="122" font-size="12" fill="#62706c">early_decrement_balance_percent = 50</text><rect x="216" y="88" width="190" height="26" rx="4" fill="#12a594"></rect><text x="224" y="106" font-size="12" font-weight="600" fill="#ffffff">50%</text><rect x="408" y="88" width="188" height="26" rx="4" fill="#5b5bd6"></rect><text x="414" y="106" font-size="12" font-weight="600" fill="#ffffff">50%</text></g></svg>
