<svg xmlns="http://www.w3.org/2000/svg" width="640" height="218" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 218" role="img" aria-label="Callbacks produced by each requested delivery-receipt level" preserveAspectRatio="xMidYMid meet"><rect width="640" height="218" fill="#ffffff"/><title>Callbacks produced by each requested delivery-receipt level</title><desc>Level 1 produces one callback when the SMSC answers the submit. Level 2 produces one callback later, when the carrier reports a final state, and none at all if the submit failed. Level 3 produces both.</desc><line x1="140" y1="26" x2="140" y2="186" stroke="#dfe6e2" stroke-width="2"></line><text x="140" y="16" text-anchor="middle" font-size="11" fill="#62706c">submit</text><text x="470" y="16" text-anchor="middle" font-size="11" fill="#62706c">minutes to hours later</text><g><text x="0" y="49" font-size="13" font-weight="600" fill="#17201e">Level 1</text><text x="0" y="66" font-size="11" fill="#62706c">submit answer only</text><line x1="140" y1="44" x2="600" y2="44" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="4 6"></line><circle cx="140" cy="44" r="7" fill="#12a594" stroke="#ffffff" stroke-width="2"></circle><text x="154" y="48" font-size="12" fill="#17201e">callback level=1</text></g><g><text x="0" y="105" font-size="13" font-weight="600" fill="#17201e">Level 2</text><text x="0" y="122" font-size="11" fill="#62706c">final state only</text><line x1="140" y1="100" x2="600" y2="100" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="4 6"></line><circle cx="470" cy="100" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="484" y="104" font-size="12" fill="#17201e">callback level=2</text></g><g><text x="0" y="161" font-size="13" font-weight="600" fill="#17201e">Level 3</text><text x="0" y="178" font-size="11" fill="#62706c">both</text><line x1="140" y1="156" x2="600" y2="156" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="4 6"></line><circle cx="140" cy="156" r="7" fill="#12a594" stroke="#ffffff" stroke-width="2"></circle><text x="154" y="160" font-size="12" fill="#17201e">callback level=1</text><circle cx="470" cy="156" r="7" fill="#5b5bd6" stroke="#ffffff" stroke-width="2"></circle><text x="484" y="160" font-size="12" fill="#17201e">callback level=2</text></g></svg>
