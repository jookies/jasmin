<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 240" role="img" aria-label="How a downstream application receives terminated messages" preserveAspectRatio="xMidYMid meet"><rect width="640" height="240" fill="#ffffff"/><title>How a downstream application receives terminated messages</title><desc>A partner submits a message. The termination connector decodes it and writes it to the message spool. From the spool there are two supported paths to a downstream application: http-push, where the gateway POSTs each message to your endpoint, and pull, where your application fetches over a cursor API with a scoped read token. A third path, tapping the message broker directly, is deliberately not offered.</desc><defs><marker id="sinks-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12a594"></path></marker><marker id="sinks-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5bd6"></path></marker></defs><g><rect x="4" y="86" width="124" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="66" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Partner ESME</text><text x="66" y="129" text-anchor="middle" font-size="10.5" fill="#62706c">submit_sm</text></g><line x1="132" x2="158" y1="116" y2="116" stroke="#12a594" stroke-width="2" marker-end="url(#sinks-out)"></line><g><rect x="162" y="86" width="134" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="229" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Termination connector</text><text x="229" y="129" text-anchor="middle" font-size="10.5" fill="#62706c">decode + verdict</text></g><line x1="300" x2="326" y1="116" y2="116" stroke="#12a594" stroke-width="2" marker-end="url(#sinks-out)"></line><g><rect x="330" y="86" width="104" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="382" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Message spool</text><text x="382" y="129" text-anchor="middle" font-size="10.5" fill="#62706c">24h retention</text></g><path d="M434 100 C 470 100, 470 40, 500 40" fill="none" stroke="#12a594" stroke-width="2" marker-end="url(#sinks-out)"></path><g><rect x="504" y="12" width="132" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="570" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">http-push</text><text x="570" y="55" text-anchor="middle" font-size="10.5" fill="#62706c">gateway POSTs to you</text></g><path d="M500 130 C 470 130, 470 118, 438 118" fill="none" stroke="#5b5bd6" stroke-width="2" marker-end="url(#sinks-in)"></path><g><rect x="504" y="100" width="132" height="60" rx="9" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"></rect><text x="570" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">pull</text><text x="570" y="143" text-anchor="middle" font-size="10.5" fill="#62706c">you GET /messages</text></g><path d="M434 132 C 470 132, 470 200, 500 200" fill="none" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="5 4"></path><g opacity="0.55"><g><rect x="504" y="172" width="132" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="570" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">broker tap</text><text x="570" y="215" text-anchor="middle" font-size="10.5" fill="#62706c">not offered</text></g><line x1="508" x2="632" y1="202" y2="202" stroke="#62706c" stroke-width="2"></line></g><text x="4" y="224" font-size="11" fill="#62706c">Sink is a per-connector setting: http-push, pull, both, or none.</text></svg>
