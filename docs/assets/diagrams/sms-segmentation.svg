<svg xmlns="http://www.w3.org/2000/svg" width="640" height="194" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 194" role="img" aria-label="Characters per SMS part by encoding" preserveAspectRatio="xMidYMid meet"><rect width="640" height="194" fill="#ffffff"/><title>Characters per SMS part by encoding</title><desc>GSM-7 fits 160 characters in a single part and 153 per part once concatenated. UCS-2 fits 70 in a single part and 67 per part concatenated.</desc><g><text x="0" y="28" font-size="13" fill="#17201e">GSM-7, single part</text><rect x="216" y="14" width="340" height="20" rx="4" fill="#12a594"></rect><text x="566" y="29" font-size="13" font-weight="600" fill="#17201e">160</text></g><g><text x="0" y="68" font-size="13" fill="#17201e">GSM-7, concatenated</text><rect x="216" y="54" width="325.125" height="20" rx="4" fill="#12a594"></rect><text x="551.125" y="69" font-size="13" font-weight="600" fill="#17201e">153</text></g><g><text x="0" y="108" font-size="13" fill="#17201e">UCS-2, single part</text><rect x="216" y="94" width="148.75" height="20" rx="4" fill="#12a594"></rect><text x="374.75" y="109" font-size="13" font-weight="600" fill="#17201e">70</text></g><g><text x="0" y="148" font-size="13" fill="#17201e">UCS-2, concatenated</text><rect x="216" y="134" width="142.375" height="20" rx="4" fill="#12a594"></rect><text x="368.375" y="149" font-size="13" font-weight="600" fill="#17201e">67</text></g><text x="216" y="186" font-size="12" fill="#62706c">characters per part</text></svg>
