<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 210" role="img" aria-label="Route evaluation order and first-match selection" preserveAspectRatio="xMidYMid meet"><rect width="640" height="210" fill="#ffffff"/><title>Route evaluation order and first-match selection</title><desc>Routes are evaluated from the highest order down. The first route whose filters all match selects the connector, and evaluation stops there. The default route at order zero has no filters and catches everything that reached it.</desc><g><rect x="44" y="18" width="556" height="44" rx="8" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="62" y="45" font-size="13" font-weight="600" fill="#17201e">order 20</text><text x="162" y="45" font-size="13" fill="#62706c">destination starts with 44</text><text x="392" y="45" font-size="13" fill="#17201e">→ carrier-uk</text><path d="M24,40 L24,76" stroke="#dfe6e2" stroke-width="2" marker-end="url(#route-arrow)"></path></g><g><rect x="44" y="76" width="556" height="44" rx="8" fill="#f0fbf8" stroke="#12a594" stroke-width="2"></rect><text x="62" y="103" font-size="13" font-weight="600" fill="#17201e">order 10</text><text x="162" y="103" font-size="13" fill="#62706c">customer group = wholesale</text><text x="392" y="103" font-size="13" fill="#17201e">→ carrier-bulk</text><text x="588" y="103" text-anchor="end" font-size="11" font-weight="600" fill="#12a594">MATCH · stop</text></g><g><rect x="44" y="134" width="556" height="44" rx="8" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="62" y="161" font-size="13" font-weight="600" fill="#17201e">order 0</text><text x="162" y="161" font-size="13" fill="#62706c">default · no filters</text><text x="392" y="161" font-size="13" fill="#17201e">→ carrier-fallback</text></g><defs><marker id="route-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dfe6e2"></path></marker></defs></svg>
