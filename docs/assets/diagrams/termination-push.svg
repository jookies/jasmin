<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 230" role="img" aria-label="What happens to one message when the delivery sink is http-push" preserveAspectRatio="xMidYMid meet"><rect width="640" height="230" fill="#ffffff"/><title>What happens to one message when the delivery sink is http-push</title><desc>The spooled message is picked up by the delivery runner, which POSTs a signed JSON body to your endpoint. A 2xx response marks it delivered. A failure is retried with exponential backoff up to a bounded number of attempts, after which the message is dead-lettered and stays readable in the spool. Separately and in parallel, the receipt runner sends the partner a delivery receipt decided by the verdict, never by whether your endpoint answered.</desc><defs><marker id="push-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12a594"></path></marker><marker id="push-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5bd6"></path></marker></defs><g><rect x="4" y="40" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="62" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Spool row</text><text x="62" y="83" text-anchor="middle" font-size="10.5" fill="#62706c">pending</text></g><line x1="124" x2="150" y1="70" y2="70" stroke="#12a594" stroke-width="2" marker-end="url(#push-out)"></line><g><rect x="154" y="40" width="124" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="216" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Delivery runner</text><text x="216" y="83" text-anchor="middle" font-size="10.5" fill="#62706c">batched, paced</text></g><line x1="282" x2="308" y1="70" y2="70" stroke="#12a594" stroke-width="2" marker-end="url(#push-out)"></line><g><rect x="312" y="40" width="140" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="382" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">POST your endpoint</text><text x="382" y="83" text-anchor="middle" font-size="10.5" fill="#62706c">HMAC-signed JSON</text></g><line x1="456" x2="482" y1="70" y2="70" stroke="#12a594" stroke-width="2" marker-end="url(#push-out)"></line><g><rect x="486" y="40" width="110" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="541" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">2xx</text><text x="541" y="83" text-anchor="middle" font-size="10.5" fill="#62706c">delivered</text></g><path d="M382 102 L 382 132" fill="none" stroke="#62706c" stroke-width="2" stroke-dasharray="5 4"></path><g><rect x="312" y="134" width="140" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="382" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">retry with backoff</text><text x="382" y="177" text-anchor="middle" font-size="10.5" fill="#62706c">doubling, capped</text></g><line x1="456" x2="482" y1="164" y2="164" stroke="#62706c" stroke-width="2"></line><g><rect x="486" y="134" width="110" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="541" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">dead letter</text><text x="541" y="177" text-anchor="middle" font-size="10.5" fill="#62706c">still in spool</text></g><line x1="62" x2="62" y1="104" y2="162" stroke="#5b5bd6" stroke-width="2" marker-end="url(#push-in)"></line><g><rect x="4" y="166" width="116" height="60" rx="9" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"></rect><text x="62" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Receipt runner</text><text x="62" y="209" text-anchor="middle" font-size="10.5" fill="#62706c">verdict decides</text></g><text x="130" y="198" font-size="11" fill="#62706c">Independent of the push: the partner&#x27;s DLR does not wait for your endpoint.</text></svg>
