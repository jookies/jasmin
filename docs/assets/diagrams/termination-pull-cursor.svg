<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 250" role="img" aria-label="How the pull API pages, and why it is not an offset" preserveAspectRatio="xMidYMid meet"><rect width="640" height="250" fill="#ffffff"/><title>How the pull API pages, and why it is not an offset</title><desc>The spool allocates each row a sequence number in commit order, and re-allocates it whenever the row changes. A pull returns a next_cursor encoding the last sequence seen; passing it back as the after parameter resumes exactly there. Because a mutated row gets a new, higher sequence, a message that was re-spooled or retried after you paged past it is handed back rather than skipped, which paging on a timestamp or an offset would not do.</desc><defs><marker id="pull-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5bd6"></path></marker></defs><text x="4" y="20" font-size="12" font-weight="600" fill="#17201e">Message spool, ordered by sequence</text><g><rect x="4" y="34" width="300" height="38" rx="8" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="18" y="58" font-size="13" font-weight="600" fill="#17201e">seq 41</text><text x="96" y="58" font-size="11.5" fill="#62706c">read</text></g><g><rect x="4" y="80" width="300" height="38" rx="8" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="18" y="104" font-size="13" font-weight="600" fill="#17201e">seq 42</text><text x="96" y="104" font-size="11.5" fill="#62706c">read</text></g><g><rect x="4" y="126" width="300" height="38" rx="8" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"></rect><text x="18" y="150" font-size="13" font-weight="600" fill="#17201e">seq 43</text><text x="96" y="150" font-size="11.5" fill="#5b5bd6">cursor points here</text></g><g><rect x="4" y="172" width="300" height="38" rx="8" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="18" y="196" font-size="13" font-weight="600" fill="#17201e">seq 44</text><text x="96" y="196" font-size="11.5" fill="#62706c">next page</text></g><line x1="308" x2="344" y1="126" y2="126" stroke="#5b5bd6" stroke-width="2" marker-end="url(#pull-arrow)"></line><g><rect x="348" y="62" width="140" height="60" rx="9" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"></rect><text x="418" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">GET /messages</text><text x="418" y="105" text-anchor="middle" font-size="10.5" fill="#62706c">limit, filters</text></g><g><rect x="348" y="146" width="140" height="60" rx="9" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"></rect><text x="418" y="171" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">next_cursor</text><text x="418" y="189" text-anchor="middle" font-size="10.5" fill="#62706c">opaque, resumable</text></g><path d="M488 176 C 540 176, 540 92, 492 92" fill="none" stroke="#5b5bd6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pull-arrow)"></path><text x="500" y="136" font-size="11" fill="#62706c">pass back</text><text x="500" y="152" font-size="11" fill="#62706c">as ?after=</text><text x="4" y="240" font-size="11" fill="#62706c">A mutated row is re-sequenced, so a retried or re-spooled message is handed back, never skipped.</text></svg>
