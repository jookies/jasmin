<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 250" role="img" aria-label="SMPP bind modes between an ESME and an SMSC" preserveAspectRatio="xMidYMid meet"><rect width="640" height="250" fill="#ffffff"/><title>SMPP bind modes between an ESME and an SMSC</title><desc>An ESME on the left and an SMSC on the right. A transmitter bind carries submit_sm outbound only. A receiver bind carries deliver_sm inbound only. A transceiver bind carries both directions over one session.</desc><defs><marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12a594"></path></marker><marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5bd6"></path></marker></defs><g><rect x="8" y="96" width="132" height="58" rx="10" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="74" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#17201e">ESME</text><text x="74" y="140" text-anchor="middle" font-size="12" fill="#62706c">your gateway</text></g><g><rect x="500" y="96" width="132" height="58" rx="10" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="566" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#17201e">SMSC</text><text x="566" y="140" text-anchor="middle" font-size="12" fill="#62706c">carrier / aggregator</text></g><g><text x="320" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#62706c">Transmitter (TX)</text><line x1="152" x2="494" y1="42" y2="42" stroke="#12a594" stroke-width="2" marker-end="url(#arrow-out)"></line></g><g><text x="320" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#62706c">Receiver (RX)</text><line x1="494" x2="152" y1="125" y2="125" stroke="#5b5bd6" stroke-width="2" marker-end="url(#arrow-in)"></line></g><g><text x="320" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#62706c">Transceiver (TRX)</text><line x1="152" x2="494" y1="192" y2="192" stroke="#12a594" stroke-width="2" marker-end="url(#arrow-out)"></line><line x1="494" x2="152" y1="208" y2="208" stroke="#5b5bd6" stroke-width="2" marker-end="url(#arrow-in)"></line></g></svg>
