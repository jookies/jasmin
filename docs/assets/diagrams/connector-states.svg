<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 250" role="img" aria-label="Desired state versus observed state on a connector" preserveAspectRatio="xMidYMid meet"><rect width="640" height="250" fill="#ffffff"/><title>Desired state versus observed state on a connector</title><desc>Desired state is the boolean the admin plane stores for a connector: started or stopped. Observed state is reported by the live SMPP session and is one of disconnected, connecting or bound. Requesting a start moves the session from disconnected to connecting to bound. Requesting a stop, or losing the connection, moves it back to disconnected. If desired stays started while observed stays disconnected, the cause is one of a fixed set of reasons.</desc><defs><marker id="connectorstate-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17201e"></path></marker><marker id="connectorstate-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62706c"></path></marker></defs><g><rect x="40" y="30" width="140" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="110" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">DISCONNECTED</text></g><g><rect x="260" y="30" width="140" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="330" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">CONNECTING</text></g><g><rect x="480" y="30" width="140" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="550" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">BOUND</text></g><line x1="183" x2="257" y1="60" y2="60" stroke="#17201e" stroke-width="2" marker-end="url(#connectorstate-fwd)"></line><text x="220" y="52" text-anchor="middle" font-size="9.5" fill="#62706c">start requested</text><line x1="403" x2="477" y1="60" y2="60" stroke="#17201e" stroke-width="2" marker-end="url(#connectorstate-fwd)"></line><text x="440" y="52" text-anchor="middle" font-size="9.5" fill="#62706c">bind accepted</text><path d="M550,90 L550,118 L110,118 L110,90" fill="none" stroke="#62706c" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#connectorstate-back)"></path><text x="330" y="132" text-anchor="middle" font-size="9.5" fill="#62706c">stop requested, or the session drops</text><rect x="20" y="155" width="600" height="78" rx="10" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="40" y="178" font-size="12.5" font-weight="700" fill="#17201e">Started but stuck at DISCONNECTED means one of:</text><text x="40" y="200" font-size="11.5" fill="#62706c">wrong credentials · wrong host or port · a rejected bind</text><text x="40" y="218" font-size="11.5" fill="#62706c">a network block · reconnect backoff</text></svg>
