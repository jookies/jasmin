<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 290" role="img" aria-label="The two object graphs behind every message" preserveAspectRatio="xMidYMid meet"><rect width="640" height="290" fill="#ffffff"/><title>The two object graphs behind every message</title><desc>Account and access: a group carries a shared balance and quota; every member user draws from it. A user can be mirrored by a separate SMPPs bind account with its own credentials for customers that connect over SMPP. Routing and carriers: a route holds priority and filters and points to an ordered list of connectors; if the first connector is unavailable, the next in the list is tried.</desc><line x1="320" y1="8" x2="320" y2="282" stroke="#dfe6e2" stroke-width="1" stroke-dasharray="3 5"></line><text x="150" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#62706c" style="text-transform:uppercase;letter-spacing:0.06em">Account &amp; access</text><g><rect x="70" y="26" width="160" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="150" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Group</text><text x="150" y="69" text-anchor="middle" font-size="10.5" fill="#62706c">shared balance + quota</text></g><line x1="150" y1="86" x2="150" y2="116" stroke="#dfe6e2" stroke-width="2" marker-end="url(#objectmodel-arrow)"></line><text x="158" y="104" font-size="9.5" fill="#62706c">every member draws from it</text><g><rect x="70" y="116" width="160" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="150" y="141" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">User</text><text x="150" y="159" text-anchor="middle" font-size="10.5" fill="#62706c">HTTP identity + credentials</text></g><line x1="150" y1="176" x2="150" y2="206" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#objectmodel-arrow)"></line><text x="158" y="194" font-size="9.5" fill="#62706c">mirrors, on request</text><g><rect x="70" y="206" width="160" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="150" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">SMPPs bind account</text><text x="150" y="249" text-anchor="middle" font-size="10.5" fill="#62706c">separate credentials + IP allowlist</text></g><text x="470" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#62706c" style="text-transform:uppercase;letter-spacing:0.06em">Routing &amp; carriers</text><g><rect x="390" y="26" width="160" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="470" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Route</text><text x="470" y="69" text-anchor="middle" font-size="10.5" fill="#62706c">priority + filters</text></g><line x1="470" y1="86" x2="470" y2="116" stroke="#12a594" stroke-width="2" marker-end="url(#objectmodel-arrow-out)"></line><text x="478" y="104" font-size="9.5" fill="#62706c">1st in the list</text><g><rect x="390" y="116" width="160" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="470" y="141" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Connector A</text><text x="470" y="159" text-anchor="middle" font-size="10.5" fill="#62706c">tried first</text></g><line x1="470" y1="176" x2="470" y2="206" stroke="#dfe6e2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#objectmodel-arrow)"></line><text x="478" y="194" font-size="9.5" fill="#62706c">failover if unavailable</text><g><rect x="390" y="206" width="160" height="60" rx="9" fill="#ffffff" stroke="#dfe6e2" stroke-width="2"></rect><text x="470" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Connector B</text><text x="470" y="249" text-anchor="middle" font-size="10.5" fill="#62706c">tried if A cannot take it</text></g><defs><marker id="objectmodel-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dfe6e2"></path></marker><marker id="objectmodel-arrow-out" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12a594"></path></marker></defs></svg>
