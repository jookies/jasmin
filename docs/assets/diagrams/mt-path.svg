<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" font-family="system-ui, -apple-system, Segoe UI, sans-serif" viewBox="0 0 640 150" role="img" aria-label="The end-to-end path of one outbound message" preserveAspectRatio="xMidYMid meet"><rect width="640" height="150" fill="#ffffff"/><title>The end-to-end path of one outbound message</title><desc>An application submits a message over the HTTP API or an SMPP bind. Access is checked against credentials, group state, quota and balance. The MT route selects a connector by priority and filters. The connector sends the message upstream in ordered failover order. The SMSC is the carrier or aggregator that accepts it.</desc><defs><marker id="mtpath-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12a594"></path></marker></defs><g><g><rect x="4" y="44" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="62" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Application</text><text x="62" y="87" text-anchor="middle" font-size="10.5" fill="#62706c">HTTP API or SMPP</text></g><line x1="123" x2="130" y1="74" y2="74" stroke="#12a594" stroke-width="2" marker-end="url(#mtpath-arrow)"></line></g><g><g><rect x="133" y="44" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="191" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Access check</text><text x="191" y="87" text-anchor="middle" font-size="10.5" fill="#62706c">creds, quota, balance</text></g><line x1="252" x2="259" y1="74" y2="74" stroke="#12a594" stroke-width="2" marker-end="url(#mtpath-arrow)"></line></g><g><g><rect x="262" y="44" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="320" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">MT route</text><text x="320" y="87" text-anchor="middle" font-size="10.5" fill="#62706c">priority + filters</text></g><line x1="381" x2="388" y1="74" y2="74" stroke="#12a594" stroke-width="2" marker-end="url(#mtpath-arrow)"></line></g><g><g><rect x="391" y="44" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="449" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">Connector</text><text x="449" y="87" text-anchor="middle" font-size="10.5" fill="#62706c">ordered failover list</text></g><line x1="510" x2="517" y1="74" y2="74" stroke="#12a594" stroke-width="2" marker-end="url(#mtpath-arrow)"></line></g><g><g><rect x="520" y="44" width="116" height="60" rx="9" fill="#ffffff" stroke="#12a594" stroke-width="2"></rect><text x="578" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="#17201e">SMSC</text><text x="578" y="87" text-anchor="middle" font-size="10.5" fill="#62706c">carrier network</text></g></g></svg>
